<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="외계 침략자들의 머리통을 깨부수는 중입니다 - ST011 릴스 목록">
  <title>ST011 · 외계 침략자들의 머리통을 깨부수는 중입니다</title>
  <style>
    :root{--bg:#090b13;--panel:#111522;--line:#252b3c;--text:#f6f7fb;--muted:#98a2b8;--pink:#ff5c91;--blue:#6bb5ff;--gold:#ffc86b}
    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;color:var(--text);background:radial-gradient(circle at 90% 0,#25204b 0,transparent 35%),var(--bg);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI","Malgun Gothic",sans-serif}
    a{color:inherit}.wrap{width:min(1120px,calc(100% - 36px));margin:auto}.hero{padding:72px 0 48px}.eyebrow{color:var(--gold);font-size:13px;font-weight:800;letter-spacing:.16em;text-transform:uppercase}.hero h1{max-width:760px;margin:18px 0 16px;font-size:clamp(34px,6vw,68px);line-height:1.06;letter-spacing:-.065em}.hero p{max-width:650px;margin:0;color:var(--muted);font-size:17px;line-height:1.75}.hero-links{display:flex;gap:10px;flex-wrap:wrap;margin-top:28px}.hero-links a,.filter button{border:1px solid var(--line);border-radius:999px;padding:10px 16px;text-decoration:none;background:#171c2a;font-weight:750}.hero-links a:hover,.filter button:hover{border-color:var(--blue);transform:translateY(-1px)}.stats{display:flex;gap:10px;flex-wrap:wrap;margin-top:35px}.stat{padding:13px 17px;background:rgba(17,21,34,.8);border:1px solid var(--line);border-radius:14px}.stat b{display:block;font-size:21px}.stat span{color:var(--muted);font-size:12px}.toolbar{position:sticky;top:0;z-index:2;padding:14px 0;background:rgba(9,11,19,.84);backdrop-filter:blur(16px);border-bottom:1px solid rgba(37,43,60,.8)}.filter{display:flex;gap:8px;align-items:center;overflow:auto}.filter button{color:var(--muted);cursor:pointer;white-space:nowrap}.filter button.active{background:var(--text);color:var(--bg);border-color:var(--text)}.search{margin-left:auto;min-width:190px;padding:11px 14px;border:1px solid var(--line);border-radius:999px;color:var(--text);background:var(--panel);outline:0}.section-head{display:flex;justify-content:space-between;align-items:end;margin:44px 0 18px}.section-head h2{margin:0;font-size:25px;letter-spacing:-.04em}.section-head span{color:var(--muted);font-size:13px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:15px;padding-bottom:70px}.card{min-height:230px;padding:22px;border:1px solid var(--line);border-radius:22px;background:linear-gradient(145deg,rgba(24,29,46,.96),rgba(14,17,28,.96));transition:.2s}.card:hover{border-color:#4e5c7c;transform:translateY(-3px)}.card[hidden]{display:none}.card-top{display:flex;justify-content:space-between;align-items:center}.episode{color:var(--gold);font-size:13px;font-weight:850}.part{color:var(--muted);font-size:12px}.card h3{margin:19px 0 8px;font-size:20px;line-height:1.35;letter-spacing:-.045em}.card p{margin:0;color:var(--muted);font-size:13px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:25px}.actions a{padding:9px 11px;border-radius:10px;text-decoration:none;font-size:12px;font-weight:800;background:#1d2639}.actions a.yt{color:var(--blue)}.actions a.ig{color:var(--pink)}.actions a.blog{color:var(--gold)}.empty{grid-column:1/-1;text-align:center;padding:50px;color:var(--muted)}footer{padding:26px 0 48px;border-top:1px solid var(--line);color:var(--muted);font-size:12px;line-height:1.7}
    @media(max-width:800px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:560px){.wrap{width:min(100% - 24px,1120px)}.hero{padding:48px 0 35px}.hero h1{font-size:40px}.search{min-width:145px}.grid{grid-template-columns:1fr}.section-head{margin-top:34px}}
  </style>
</head>
<body>
  <header class="hero wrap">
    <div class="eyebrow">ST011 · NOVEL REELS</div>
    <h1>외계 침략자들의<br>머리통을 깨부수는 중입니다</h1>
    <p>압구정 로데오를 지키는 헌터 놀부의 통쾌한 사냥극. 회차별 릴스를 한곳에서 보고 YouTube Shorts와 Instagram 원 게시물로 바로 이동하세요.</p>
    <div class="hero-links"><a href="https://novelpia.com/novel/458237" target="_blank" rel="noopener">📖 작품 보러가기</a><a href="https://okluckday9009.blogspot.com/p/st011.html" target="_blank" rel="noopener">블로그 목록</a></div>
    <div class="stats"><div class="stat"><b>12</b><span>공개 릴스</span></div><div class="stat"><b>4</b><span>회차</span></div><div class="stat"><b>2</b><span>연결 플랫폼</span></div></div>
  </header>
  <div class="toolbar"><div class="wrap filter"><button class="active" data-ep="all">전체</button><button data-ep="1">1화</button><button data-ep="2">2화</button><button data-ep="3">3화</button><button data-ep="4">4화</button><input id="search" class="search" type="search" placeholder="회차·릴스 검색" aria-label="회차·릴스 검색"></div></div>
  <main class="wrap"><div class="section-head"><h2>회차별 릴스</h2><span id="count">12개 공개</span></div><section class="grid" id="cards" aria-live="polite"></section></main>
  <footer><div class="wrap">© ST011 · 외계 침략자들의 머리통을 깨부수는 중입니다<br>Instagram은 실제 게시물 permalink, YouTube는 Shorts 공개 주소로 연결됩니다.</div></footer>
  <script>
    const episodes={1:'외계 침략자들의 머리통을 깨부수는 중입니다',2:'밭을 갈다 말고 외계인을 잡는 법',3:'양반 놈들의 몰수 통지서',4:'위장한 놈은 머리통부터'};
    const items=[
      [1,1,'h71V_TuY8aE','DeT11DfCuy5'],[1,2,'2oEH3AZr828','DeT2FqKDecx'],[1,4,'5866aR7x1Wc','DeT2aIpCD3w'],
      [2,1,'pRahe1YT7Gk','DeT2qjZjl4y'],[2,2,'icGNp7vHbL8','DeT3AYilDQW'],[2,3,'TLaUuXp0Tio','DeT3PUkDRfa'],[2,4,'d_5WzrYfYfo','DeT3c35DJd8'],
      [3,1,'-ogIaoAQ8pc','DeUOO4tgRY1','https://okluckday9009.blogspot.com/2026/10/st011-3-1.html'],[3,2,'vuyFO8co-Tc','DeUOekKgqoB','https://okluckday9009.blogspot.com/2026/10/st011-3-2.html'],[3,4,'KLglSSzlhNg','DeUQIN5Ai72','https://okluckday9009.blogspot.com/2026/10/st011-3-4.html'],
      [4,1,'MNRYfB_dFZ0','DeUQVhTjrrh','https://okluckday9009.blogspot.com/2026/10/st011-4-1.html'],[4,2,'YEuZNyQRZB8','DeUQl2rDQXQ','https://okluckday9009.blogspot.com/2026/10/st011-4-2.html']
    ];
    const cards=document.querySelector('#cards'), count=document.querySelector('#count');
    function draw(ep='all',q=''){cards.innerHTML='';let n=0;items.forEach(([e,p,yt,ig,blog])=>{const hay=`${e}화 ${p} ${episodes[e]}`.toLowerCase();if(ep!=='all'&&String(e)!==ep||q&&!hay.includes(q.toLowerCase()))return;n++;const links=`<a class="yt" href="https://www.youtube.com/shorts/${yt}" target="_blank" rel="noopener">▶ YouTube</a><a class="ig" href="https://www.instagram.com/reel/${ig}/" target="_blank" rel="noopener">◎ Instagram</a>${blog?`<a class="blog" href="${blog}" target="_blank" rel="noopener">↗ 블로그</a>`:''}`;cards.insertAdjacentHTML('beforeend',`<article class="card"><div class="card-top"><span class="episode">${e}화</span><span class="part">릴스 ${p}</span></div><h3>${episodes[e]}</h3><p>ST011 · ${e}화 · 릴스 ${p}</p><div class="actions">${links}</div></article>`)});if(!n)cards.innerHTML='<div class="empty">조건에 맞는 릴스가 없습니다.</div>';count.textContent=`${n}개 공개`}
    let ep='all';document.querySelectorAll('[data-ep]').forEach(b=>b.addEventListener('click',()=>{document.querySelector('.active').classList.remove('active');b.classList.add('active');ep=b.dataset.ep;draw(ep,document.querySelector('#search').value)}));document.querySelector('#search').addEventListener('input',e=>draw(ep,e.target.value));draw();
  </script>
</body>
</html>
